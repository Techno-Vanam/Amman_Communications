name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/amman_comm_db?schema=public"
      JWT_ACCESS_SECRET: "e4f8b91c82d3a4e5f60718293a4b5c6d7e8f901234567890abcdef1234567890"
      JWT_REFRESH_SECRET: "a1b2c3d4e5f60718293a4b5c6d7e8f901234567890abcdef1234567890abcdef"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Project
        run: pnpm build
